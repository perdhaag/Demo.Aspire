name: images

# Builds one container image per deployable service and pushes it to GHCR. Nothing here
# touches the cluster: the Pi finds the new images itself (see deploy/cluster/pi/images.yaml).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY: perdhaag/demo-aspire

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: screenings,    project: src/Demo.Aspire.Screenings/Demo.Aspire.Screenings.csproj }
          - { name: bookings,      project: src/Demo.Aspire.Bookings/Demo.Aspire.Bookings.csproj }
          - { name: payments,      project: src/Demo.Aspire.Payments/Demo.Aspire.Payments.csproj }
          - { name: notifications, project: src/Demo.Aspire.Notifications/Demo.Aspire.Notifications.csproj }
          - { name: gateway,       project: src/Demo.Aspire.Gateway/Demo.Aspire.Gateway.csproj }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Only the gateway needs it -- its csproj bundles the React app into wwwroot with
      # `bun build` -- but installing it unconditionally keeps the matrix uniform and costs
      # a couple of seconds.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The Pi is arm64 and these runners are x64, but no emulation is involved: a .NET
      # RID-specific publish cross-builds, and the aspnet base image is multi-arch, so the
      # SDK pulls the arm64 variant to layer onto.
      #
      # The tag carries a commit timestamp because that is what Flux sorts on to decide
      # which image is newest -- see the ImagePolicy in deploy/cluster/pi/images.yaml.
      - name: Compute tag
        id: tag
        run: echo "value=main-$(git rev-parse --short HEAD)-$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      # Credentials go in explicitly rather than through `docker login`. The SDK can read
      # ~/.docker/config.json, but doing so failed against ghcr.io with CONTAINER1016 even
      # after a successful login. The PUSH_ prefix matters: the generic
      # DOTNET_CONTAINER_REGISTRY_UNAME/PWORD pair would also be offered to the anonymous
      # pull of the mcr.microsoft.com base image.
      - name: Publish ${{ matrix.service.name }}
        env:
          DOTNET_CONTAINER_PUSH_REGISTRY_UNAME: ${{ github.actor }}
          DOTNET_CONTAINER_PUSH_REGISTRY_PWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet publish ${{ matrix.service.project }} \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained false \
            /t:PublishContainer \
            -p:ContainerRegistry=${{ env.REGISTRY }} \
            -p:ContainerRepository=${{ env.REPOSITORY }}/${{ matrix.service.name }} \
            -p:ContainerImageTag=${{ steps.tag.outputs.value }}

      - name: Summary
        run: echo "pushed ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.service.name }}:${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
