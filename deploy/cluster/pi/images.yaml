# Image automation: how a push to main reaches the Pi without anyone running kubectl.
#
#   ImageRepository      polls GHCR for the tag list of one image
#   ImagePolicy          picks the newest of those tags
#   ImageUpdateAutomation rewrites the $imagepolicy setters in deploy/apps/demo-kino
#                        and commits the result back to main, which helm-controller
#                        then rolls out
#
# These live in flux-system rather than demo-kino because that is the namespace the
# $imagepolicy markers in release.yaml name.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: screenings
  namespace: flux-system
spec:
  image: ghcr.io/perdhaag/demo-aspire/screenings
  interval: 5m
  # The packages are private, so listing tags needs credentials. Same pull secret the
  # cluster uses, created by docs/gitops.md.
  secretRef:
    name: ghcr-creds
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: screenings
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: screenings
  # Tags are main-<short sha>-<commit timestamp>. Git history is not necessarily the
  # order images finish building, so the timestamp is extracted and compared numerically
  # rather than trusting tag order.
  filterTags:
    pattern: '^main-[0-9a-f]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
