---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: demo-kino
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore: roll images to {{ range .Changed.Changes }}{{ .NewValue }} {{ end }}

        Committed by the Pi cluster's image-automation controller.
    push:
      branch: main
  update:
    # Deliberately narrow: only the HelmRelease carries setters, and pointing the
    # automation at deploy/chart as well would let it rewrite generated output.
    path: ./deploy/apps/demo-kino
    strategy: Setters
