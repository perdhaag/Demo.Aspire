# Every pod in this namespace pulls from a private GHCR repository, so every pod needs
# credentials. Attaching them to the namespace's default ServiceAccount rather than to each
# Deployment means Kubernetes injects the pull secret automatically -- which keeps working
# when deploy/chart is regenerated from AppHost.cs, since the generated templates carry no
# imagePullSecrets of their own.
#
# `default` is created by Kubernetes with the namespace; this patches it in place.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: demo-kino
imagePullSecrets:
  - name: ghcr-creds
