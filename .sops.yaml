# Only stringData/data are encrypted; the Kubernetes metadata stays readable so Flux's
# kustomize-controller can still see what kind of object it is holding.
creation_rules:
  - path_regex: deploy/apps/.*\.enc\.yaml$
    encrypted_regex: '^(data|stringData)$'
    # The cluster holds the matching private key as the sops-age Secret in flux-system.
    age: age16nr43tw34aqh7jknd3syqyamwn862dd063ezuac39paz7m4nverq79gxpe
